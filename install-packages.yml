
---
- name: Install packages on AWS worker nodes
  hosts: aws_ec2
  become: true
  gather_facts: true

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - unzip
          - nginx
        state: present
