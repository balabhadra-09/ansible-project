---
plugin: amazon.aws.aws_ec2

regions:
  - ap-south-1

filters:
  instance-state-name: running
  "tag:AnsibleGroup": webservers

hostnames:
  - private-ip-address

compose:
  ansible_host: private_ip_address
  ansible_user: "'ubuntu'"
  ansible_ssh_private_key_file: /home/ubuntu/ansible_project/ansible-key.pem
keyed_groups:
  - key: tags.Environment
    prefix: env
